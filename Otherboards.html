<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other State Boards - Medha App</title>
    <style>
        body {
            padding-bottom: 30px; 
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
        }

        /* Top Bar with Back Button */
        .top-bar {
            background-color: #ff5634; 
            color: white;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .title-text {
            flex-grow: 1;
            text-align: left;
        }

        .sub-title {
            text-align: left;
            margin: 20px 0 10px 5%;
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }

        /* Vertical List Layout for States */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            margin: 0 auto;
        }

        /* State Row Style */
        .state-card {
            background-color: white;
            padding: 18px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-left: 5px solid #ff5634;
            border-top: 1px solid #eef2f1;
            border-right: 1px solid #eef2f1;
            border-bottom: 1px solid #eef2f1;
        }

        .state-card:active {
            transform: scale(0.98);
        }

        .state-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .arrow-right {
            margin-left: auto;
            color: #888;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top Bar with Back Button -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">⬅️</a>
        <div class="title-text">Other State Boards</div>
    </div>

    <div class="sub-title">Select State:</div>

    <!-- States List -->
    <div class="list-container">
        <a href="up_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Uttar Pradesh (UP Board)</span>
            <span class="arrow-right">➔</span>
        </a>
        <a href="mp_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Madhya Pradesh (MP Board)</span>
            <span class="arrow-right">➔</span>
        </a>
        <a href="bihar_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Bihar Board (BSEB)</span>
            <span class="arrow-right">➔</span>
        </a>
        <a href="haryana_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Haryana Board (HBSE)</span>
            <span class="arrow-right">➔</span>
        </a>
        <a href="delhi_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Delhi (NCT/State Schools)</span>
            <span class="arrow-right">➔</span>
        </a>
        <a href="punjab_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Punjab Board (PSEB)</span>
            <span class="arrow-right">➔</span>
        </a>
        <a href="gujarat_board.html" class="state-card">
            <span class="state-icon">🔸</span>
            <span>Gujarat Board (GSEB)</span>
            <span class="arrow-right">➔</span>
        </a>
    </div>

</body>
</html>
