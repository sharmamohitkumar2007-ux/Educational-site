<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gk - Medha App</title>
    <style>
        body { 
            padding-bottom: 30px; 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            text-align: center; 
        }

        /* Top Bar with Back Button */
        .top-bar { 
            background-color: #FF9800; /* Vedas ke liye Orange Theme */
            color: white; 
            padding: 15px 20px; 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }

        .back-btn { 
            color: white; 
            text-decoration: none; 
            font-size: 24px; 
            margin-right: 15px; 
            cursor: pointer; 
        }

        .title-text { 
            flex-grow: 1; 
            text-align: left; 
        }

        .sub-title { 
            text-align: left; 
            margin: 20px 0 10px 5%; 
            font-size: 16px; 
            color: #555; 
            font-weight: bold; 
        }

        /* Material List Style */
        .listview-container { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 90%; 
            margin: 0 auto; 
        }

        .list-item { 
            background-color: white; 
            padding: 18px 20px; 
            border-radius: 12px; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.05); 
            text-decoration: none; 
            color: #333; 
            font-weight: bold; 
            font-size: 16px; 
            display: flex; 
            align-items: center; 
            border-left: 6px solid #FF9800; 
            border-top: 1px solid #eef2f1;
            border-right: 1px solid #eef2f1;
            border-bottom: 1px solid #eef2f1;
        }

        .list-item:active { 
            transform: scale(0.98); 
        }

        .item-icon { 
            font-size: 24px; 
            margin-right: 15px; 
        }

        .arrow-right { 
            margin-left: auto; 
            color: #FF9800; 
            font-size: 18px; 
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">⬅️</a>
        <div class="title-text">G.K. Study Material</div>
    </div>

    <!-- Material Options -->
    <div class="listview-container">

        <!-- 2. lucent gk Full Notes -->

            <span class="item-icon">📚</span>
            <span>lucent Complete book </span>
            <span class="arrow-right">➔</span>
        </a>

    </div>

</body>
</html>
