<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Material - Medha App</title>
    <style>
        body {
            padding-bottom: 40px; 
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
        }

        /* Material Page Header */
        .top-bar {
            background-color: #007BFF; /* Dynamic Blue Theme */
            color: white;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .title-text {
            flex-grow: 1;
            text-align: left;
        }

        .sub-title {
            text-align: left;
            margin: 20px 0 10px 5%;
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }

        /* Full Width List Container */
        .material-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            margin: 0 auto;
        }

        /* Material Row Style */
        .material-card {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-top: 1px solid #eef2f1;
            border-right: 1px solid #eef2f1;
            border-bottom: 1px solid #eef2f1;
            transition: 0.2s;
        }

        .material-card:active {
            transform: scale(0.98);
        }

        .material-icon {
            font-size: 26px;
            margin-right: 18px;
            background-color: #f0f4f8;
            padding: 10px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-right {
            margin-left: auto;
            color: #007BFF;
            font-size: 20px;
        }

        /* Border Left Colors for different options */
        .color-1 { border-left: 6px solid #FF9800; } /* Orange */
        .color-2 { border-left: 6px solid #28A745; } /* Green */
        .color-3 { border-left: 6px solid #E91E63; } /* Pink */
        .color-4 { border-left: 6px solid #9C27B0; } /* Purple */
        .color-5 { border-left: 6px solid #00BCD4; } /* Cyan */
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <!-- Aap isko javascript:history.back() bhi kar sakte hain taaki pichle page par jaye -->
        <a href="javascript:history.back()" class="back-btn">⬅️</a>
        <div class="title-text">Study Material</div>
    </div>

    <div class="sub-title">Select Option:</div>

    <!-- Material Options List -->
    <div class="material-container">
        <!-- 1. Syllabus -->
        <a href="view_syllabus.html" class="material-card color-1">
            <span class="material-icon">📋</span>
            <span>Syllabus</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 2. Notes -->
        <a href="view_notes.html" class="material-card color-2">
            <span class="material-icon">📚</span>
            <span>Notes & Study Material</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 3. Important Questions -->
        <a href="view_important.html" class="material-card color-3">
            <span class="material-icon">💡</span>
            <span>Important Questions</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 4. Previous Year Papers -->
        <a href="view_papers.html" class="material-card color-4">
            <span class="material-icon">📝</span>
            <span>Previous Year Papers (PYQs)</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 5. MCQs Test -->
        <a href="quiz.html" class="material-card color-5">
            <span class="material-icon">🎮</span>
            <span>Online MCQ Test </span>
            <span class="arrow-right">➔</span>
        </a>
    </div>

</body>
</html>
