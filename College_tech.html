<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Courses - Medha App</title>
    <style>
        body { 
            padding-bottom: 80px; 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            text-align: center; 
        }

        /* Purple Theme Header for College Section */
        .top-bar { 
            background-color: #9C27B0; 
            color: white; 
            padding: 15px 20px; 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }

        .back-btn { 
            color: white; 
            text-decoration: none; 
            font-size: 24px; 
            margin-right: 15px; 
            cursor: pointer; 
        }

        .title-text { 
            flex-grow: 1; 
            text-align: left; 
        }

        .sub-title { 
            text-align: left; 
            margin: 20px 0 10px 5%; 
            font-size: 16px; 
            color: #555; 
            font-weight: bold; 
        }

        /* Vertical ListView Layout for Technical Streams */
        .listview-container { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 90%; 
            margin: 0 auto; 
        }

        /* ListView Item Style */
        .list-item { 
            background-color: white; 
            padding: 18px 20px; 
            border-radius: 12px; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.05); 
            text-decoration: none; 
            color: #333; 
            font-weight: bold; 
            font-size: 16px; 
            display: flex; 
            align-items: center; 
            border-left: 6px solid #9C27B0; /* Purple Border */
            border-top: 1px solid #eef2f1;
            border-right: 1px solid #eef2f1;
            border-bottom: 1px solid #eef2f1;
            transition: 0.2s;
        }

        .list-item:active { 
            transform: scale(0.98); 
        }

        .item-icon { 
            font-size: 24px; 
            margin-right: 15px; 
            background-color: #f3e5f5; /* Light Purple Background */
            padding: 8px;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-right { 
            margin-left: auto; 
            color: #9C27B0; 
            font-size: 18px; 
        }

        /* Bottom Navigation Bar */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            background-color: #ffffff; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 1px solid #e0e0e0; 
            z-index: 1000; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #757575; font-size: 12px; width: 25%; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: #007BFF; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Bar with Back Button -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">⬅️</a>
        <div class="title-text">Technical Education</div>
    </div>

    <div class="sub-title">select course:</div>

    <!-- Technical Courses ListView -->
    <div class="listview-container">
        
        <!-- 1. B.Tech -->
        <a href="tech_btech.html" class="list-item">
            <span class="item-icon">⚙️</span>
            <span>B.Tech (Bachelor of Technology)</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 2. BCA -->
        <a href="tech_bca.html" class="list-item">
            <span class="item-icon">💻</span>
            <span>BCA (Bachelor of Computer Applications)</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 3. MCA -->
        <a href="tech_mca.html" class="list-item">
            <span class="item-icon">🚀</span>
            <span>MCA (Master of Computer Applications)</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 4. Polytechic Diploma -->
        <a href="tech_diploma.html" class="list-item">
            <span class="item-icon">📜</span>
            <span>Polytechnic Diploma</span>
            <span class="arrow-right">➔</span>
        </a>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span><span class="nav-text">Home</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-text">Chat</span></a>
        <a href="quiz.html" class="nav-item"><span class="nav-icon">📝</span><span class="nav-text">Quiz</span></a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-text">Profile</span></a>
    </div>

</body>
</html>
