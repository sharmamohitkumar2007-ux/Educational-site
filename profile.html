<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Medha App</title>
    <style>
        body { 
            padding-bottom: 80px; 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            text-align: center; 
        }

        /* Profile Header Card */
        .profile-header {
            background-color: #007BFF;
            color: white;
            padding: 30px 20px;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Avatar circle */
        .avatar {
            width: 90px;
            height: 90px;
            background-color: white;
            color: #007BFF;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .user-name { font-size: 22px; font-weight: bold; margin: 0; }
        .user-role { font-size: 14px; color: #e0e0e0; margin: 5px 0 0 0; }

        /* Menu Options ListView */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            margin: 25px auto;
        }

        .menu-item {
            background-color: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-left: 5px solid #007BFF;
            border-top: 1px solid #eef2f1;
            border-right: 1px solid #eef2f1;
            border-bottom: 1px solid #eef2f1;
        }

        .menu-item:active { transform: scale(0.98); }
        .menu-icon { font-size: 22px; margin-right: 15px; }
        .arrow-right { margin-left: auto; color: #007BFF; font-size: 18px; }

        /* Bottom Navigation Bar */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            background-color: #ffffff; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 1px solid #e0e0e0; 
            z-index: 1000; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #757575; font-size: 12px; width: 25%; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: #007BFF; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Profile Card -->
    <div class="profile-header">
        <div class="avatar">👤</div>
    </div>

    <!-- Options List -->
    <div class="menu-container">
        
        <!-- 1. Account Settings -->
        <a href="settings.html" class="menu-item">
            <span class="menu-icon">⚙️</span>
            <span>Settings </span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 2. Notifications -->
        <a href="notifications.html" class="menu-item">
            <span class="menu-icon">🔔</span>
            <span>Notifications </span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 3. My Saved Doubts -->
        <a href="saved_doubts.html" class="menu-item">
            <span class="menu-icon">📁</span>
            <span>My Doubts History</span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 4. Support -->
        <a href="support.html" class="menu-item">
            <span class="menu-icon">📞</span>
            <span>Help & Support </span>
            <span class="arrow-right">➔</span>
        </a>

        <!-- 5. Logout -->
        <a href="logout.html" class="menu-item" style="border-left: 5px solid #dc3545;">
            <span class="menu-icon" style="color: #dc3545;">🚪</span>
            <span style="color: #dc3545;">Logout </span>
            <span class="arrow-right" style="color: #dc3545;">➔</span>
        </a>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-text">Home</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span class="nav-text">Chat</span></a>
        <a href="quiz.html" class="nav-item"><span class="nav-icon">📝</span><span class="nav-text">Quiz</span></a>
        <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-text">Profile</span></a>
    </div>

</body>
</html>
